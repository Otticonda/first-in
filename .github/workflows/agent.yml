name: First In agent

# One shift an hour. Each shift stays on for ~55 minutes and works in a loop every 2 minutes:
# Telegram commands, Octo and the runner sweep every pass, wallets every 5 minutes,
# the deep scan every 3 hours and the recap each morning, all decided from the agent's memory.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Run one job once, or 'auto' for a full shift
        type: choice
        options: [all, watch, scan, recap, auto]
        default: all

permissions:
  contents: write

# one run at a time, so two runs never write the memory at once
concurrency:
  group: first-in-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      STATE_FILE: state/agent.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The agent's memory lives on its own branch (agent-data) as one JSON file,
      # so the site can read it without the main branch filling up with commits.
      - name: Load agent memory
        run: |
          mkdir -p state
          if git fetch --depth=1 origin agent-data 2>/dev/null; then
            git show FETCH_HEAD:agent.json > state/agent.json 2>/dev/null || true
          fi

      - name: Work
        run: |
          task="${{ inputs.task || 'auto' }}"
          if [ "$task" != "auto" ]; then
            node agent/run.mjs "$task"
            bash agent/save-state.sh
            exit 0
          fi
          end=$((SECONDS + 54 * 60))
          while true; do
            node agent/run.mjs auto || echo "pass failed, carrying on"
            bash agent/save-state.sh || echo "save failed, will retry next pass"
            [ $((SECONDS + 120)) -lt $end ] || break
            sleep 120
          done
